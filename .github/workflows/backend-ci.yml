name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r backend/requirements.txt

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build Go file server
      working-directory: ./core
      run: |
        go mod tidy
        go build -o ../file-server .      

    - name: Run Go file server in background
      run: ./file-server &
      env:
        INTERNAL_API_TOKEN: "dummy-internal-api-token-for-ci"
        STORAGE_PATH: "/tmp/storage"      

    - name: Run tests
      run: pytest backend/tests --maxfail=2
      env:
        SECRET_KEY: "dummy-secret-key-for-ci-tests"
        DATABASE_URL: "sqlite:///db.sqlite3"
        REDIS_URL: "redis://localhost:6379"
        CELERY_TASK_ALWAYS_EAGER: "True"
        INTERNAL_API_TOKEN: "dummy-internal-api-token-for-ci"
        FIELD_ENCRYPTION_KEY: "S-c9WBE3DEJE2R7i-b-sOmegRChW2McTDIOWcrG0-C8="
        CORE_API_URL: "http://localhost:8080"

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: make dist

      - name: Tag image
        run: docker tag coneshare:latest conesharedev/coneshare:rolling

      - name: Push image to Docker Hub
        run: docker push conesharedev/coneshare:rolling

name: Build CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'portal/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'portal/**'

jobs:
  # Job to determine which sub-projects have changes, avoiding unnecessary test runs.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
            - 'core/**'
            - '.github/workflows/build-ci.yml'
          frontend:
            - 'frontend/**'
            - '.github/workflows/build-ci.yml'

  # Backend testing job (Python/Django tests + Go file server compilation/execution).
  test-backend:
    needs: detect-changes
    # Run only if change detection outputs 'true' for backend (backend/ or core/)
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r backend/requirements.txt

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Run Go core tests
      working-directory: ./core
      run: go test -v ./...

    - name: Build Go file server
      working-directory: ./core
      run: |
        go mod tidy
        go build -o ../file-server .      

    - name: Run Go file server in background
      run: ./file-server &
      env:
        INTERNAL_API_TOKEN: "dummy-internal-api-token-for-ci"
        STORAGE_PATH: "/tmp/storage"      

    - name: Run tests
      run: pytest backend --maxfail=2
      env:
        SECRET_KEY: "dummy-secret-key-for-ci-tests"
        DATABASE_URL: "sqlite:///db.sqlite3"
        REDIS_URL: "redis://localhost:6379"
        CELERY_TASK_ALWAYS_EAGER: "True"
        INTERNAL_API_TOKEN: "dummy-internal-api-token-for-ci"
        FIELD_ENCRYPTION_KEY: "S-c9WBE3DEJE2R7i-b-sOmegRChW2McTDIOWcrG0-C8="
        CORE_API_URL: "http://localhost:8080"

  # Frontend testing job (React/Vite tests under frontend/src/tests/).
  test-frontend:
    needs: detect-changes
    # Run only if change detection outputs 'true' for frontend (frontend/)
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test:whitelist

  # Build and push job that runs only on pushes to the main branch.
  build-and-push:
    needs: [detect-changes, test-backend, test-frontend]
    runs-on: ubuntu-latest
    # Condition explained:
    # 1. always(): force evaluation even if parent jobs (test-backend/test-frontend) were skipped.
    # 2. github.event_name == 'push' && github.ref == 'refs/heads/main': restrict execution to pushes on main.
    # 3. needs.detect-changes.result == 'success': ensure path detection completed successfully.
    # 4. Result checks: proceed only if tests succeeded OR were skipped (meaning no changes to test).
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.result == 'success' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: make dist APP_VERSION=rolling GIT_SHA=${GITHUB_SHA}

      - name: Tag image
        run: docker tag coneshare:latest conesharedev/coneshare:rolling

      - name: Push image to Docker Hub
        run: docker push conesharedev/coneshare:rolling

name: Release Please

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'portal/**'

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GH_PAT }} # Use a PAT to trigger other workflows
          release-type: simple

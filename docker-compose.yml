services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile-dev
    restart: unless-stopped
    environment:
      - PORT=8080
      - STORAGE_PATH=/storage
      - INTERNAL_API_TOKEN=supersecrettoken # Replace with a real secret in prod
    volumes:
      - ./core:/app
      - media_volume:/storage

  backend:
    image: coneshare:dev
    build:
      context: ./backend
      dockerfile: Dockerfile-dev
    command: python manage.py runserver 0.0.0.0:8000
    # command: tail -f /dev/null
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
      - core

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  celery_worker:
    image: coneshare:dev
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile-dev
    command: celery -A backend worker -l INFO
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    restart: unless-stopped
    depends_on:
      - backend
      - redis
      - core

  frontend:
    image: coneshare:frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
  media_volume:

upstream core_server {
    server core:8080;
}

server {
    listen 80;
    server_name localhost; # or your domain

    # Increase client body size to allow for large file uploads
    client_max_body_size 500M;

    # Publicly accessible media like avatars
    location /media/avatars/ {
        alias /usr/src/app/media/avatars/;
    }

    # Proxy file upload/download requests to the Go file server
    location /files/ {
        proxy_pass http://core_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Proxy all other requests to the Django application
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

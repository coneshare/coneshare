<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Service Unavailable</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }
        p {
            margin-top: 1rem;
            font-size: 1.125rem;
            line-height: 1.75rem;
        }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 0.375rem;
            font-weight: 500;
        }
        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500 - Service Unavailable</h1>
        <p>We're sorry, but the service is temporarily unavailable. Please try again later.</p>
        <a href="/">Go to Home</a>
    </div>
</body>
</html>

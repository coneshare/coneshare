[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coneshare-mcp"
version = "0.1.0"
description = "Remote MCP Server for Coneshare workspace integration"
readme = "README.md"
authors = [
    { name = "Coneshare Team", email = "dev@coneshare.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.0,<4.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
coneshare-mcp = "coneshare_mcp.server:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["coneshare_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["coneshare_mcp"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

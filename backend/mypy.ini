[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
explicit_package_bases = True
no_implicit_optional = False
mypy_path = .

# Targeted modules: services, utils, tasks across apps, renderers, archive, spreadsheet_utils, and fileserver
files =
    automations/services.py,
    automations/tasks.py,
    cloudfiles/services.py,
    cloudfiles/tasks.py,
    core/services.py,
    core/tasks.py,
    core/i18n_utils.py,
    datarooms/services.py,
    datarooms/utils.py,
    documents/services.py,
    documents/tasks.py,
    documents/fileserver.py,
    documents/pdf_utils.py,
    documents/spreadsheet_utils.py,
    documents/renderers,
    filerequests/tasks.py,
    sharelinks/services.py,
    sharelinks/tasks.py,
    sharelinks/archive.py,
    backend/utils.py

# Exclude migrations, virtual environments, node_modules, and docs
exclude = (^|/)(migrations|\.venv|venv|node_modules|docs)/

plugins =
    mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "backend.settings"

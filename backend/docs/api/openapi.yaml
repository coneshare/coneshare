components:
  schemas:
    AdminUserDetail:
      type: object
      description: Serializer for the User model.
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        name:
          type: string
          maxLength: 255
        role:
          type: string
          maxLength: 20
        organization:
          type: string
          readOnly: true
        password:
          type: string
          writeOnly: true
          maxLength: 128
        avatar:
          type: string
          format: uri
          writeOnly: true
          nullable: true
        avatar_url:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        total_document_size:
          type: integer
          readOnly: true
          description: Total size of all documents in bytes.
        file_size_quota_mb:
          type: string
          readOnly: true
        max_files_per_upload:
          type: string
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        total_links:
          type: string
          readOnly: true
        total_datarooms:
          type: string
          readOnly: true
        total_views:
          type: string
          readOnly: true
      required:
      - avatar_url
      - date_joined
      - email
      - file_size_quota_mb
      - id
      - is_superuser
      - max_files_per_upload
      - organization
      - total_datarooms
      - total_document_size
      - total_links
      - total_views
      - updated_at
    AppConfiguration:
      type: object
      description: Serializer for the AppConfiguration model for admin use.
      properties:
        key:
          type: string
          readOnly: true
        value:
          type: string
        description:
          type: string
          readOnly: true
          description: A description of what this setting controls.
      required:
      - description
      - key
    AutomationAssignment:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
        delivery:
          type: string
        assigned_user:
          type: string
        assigned_by_rule:
          type: string
        status:
          $ref: '#/components/schemas/AutomationAssignmentStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_by_rule
      - assigned_user
      - created_at
      - delivery
      - id
      - organization
      - updated_at
    AutomationAssignmentStatusEnum:
      enum:
      - open
      - acknowledged
      - closed
      type: string
      description: |-
        * `open` - Open
        * `acknowledged` - Acknowledged
        * `closed` - Closed
    AutomationDelivery:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
        rule:
          type: string
          readOnly: true
        destination:
          type: string
          readOnly: true
        event_type:
          type: string
          readOnly: true
        payload:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AutomationDeliveryStatusEnum'
          readOnly: true
        response_code:
          type: integer
          readOnly: true
          nullable: true
        response_body_excerpt:
          type: string
          readOnly: true
        attempt_count:
          type: integer
          readOnly: true
        next_retry_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        idempotency_key:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt_count
      - created_at
      - delivered_at
      - destination
      - event_type
      - id
      - idempotency_key
      - next_retry_at
      - organization
      - payload
      - response_body_excerpt
      - response_code
      - rule
      - status
      - updated_at
    AutomationDeliveryStatusEnum:
      enum:
      - pending
      - success
      - failed
      - dead_letter
      type: string
      description: |-
        * `pending` - Pending
        * `success` - Success
        * `failed` - Failed
        * `dead_letter` - Dead Letter
    AutomationDestination:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        destination_type:
          $ref: '#/components/schemas/DestinationTypeEnum'
        endpoint_url:
          type: string
          format: uri
          maxLength: 2048
        http_method:
          $ref: '#/components/schemas/HttpMethodEnum'
        headers: {}
        signing_secret:
          type: string
          writeOnly: true
          nullable: true
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
